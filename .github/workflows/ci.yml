name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  # Note: use an exact version to keep CI results reproducible.
  GOLANGCI_LINT_VERSION: v2.11.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: build
        run: go build ./...

      # Parity (./parity/...) and the live gost-engine differential are not run
      # here: they test go-gostcrypto, not this module. go-gostcrypto's `parity`
      # workflow gates them, running them from compat master (directly and
      # through parity-engine.yml here) against every go-gostcrypto change, and
      # bump-go-gostcrypto.yml runs them against each new release before it
      # moves the pin. Here they would only retest the pinned release, and go
      # red whenever compat master holds parity tests for an unreleased
      # go-gostcrypto change. This job keeps the facade KAT/vector tests (the
      # module root package).
      - name: test (facade KAT/vector)
        run: go test .

  # golangci-lint-action v7+ is required for golangci-lint v2. go.mod pins a
  # released go-gostcrypto that resolves through the module proxy, so the
  # linter type-checks without a sibling go-gostcrypto checkout.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
